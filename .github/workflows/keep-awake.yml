name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://hanzi-stroke-app-cgt6hjhee8jt39ayiq8ppx.streamlit.app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
